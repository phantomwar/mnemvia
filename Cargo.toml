[workspace]
members = ["crates/mnemvia-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/phantomwar/mnemvia"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde_json = "1.0"
sha2 = "0.10"
walkdir = "2.5"
